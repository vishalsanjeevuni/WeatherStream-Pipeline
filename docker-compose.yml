version: '3'

services:
  weather-producer:
    build: .
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_API_KEY=${KAFKA_API_KEY}
      - KAFKA_API_SECRET=${KAFKA_API_SECRET}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - CITY=${CITY}
    env_file:
      - ./config/.env 